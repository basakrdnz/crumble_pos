# Builds the manager app (Crumble Yönetim) for iPhone on Expo's servers (EAS)
# and, when asked, sends it to TestFlight. Started by hand: Actions ->
# "Yönetim iPhone (TestFlight)" -> Run workflow.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN     expo.dev -> Account settings -> Access tokens
#   ASC_KEY_ID     App Store Connect -> Users and Access -> Integrations ->
#   ASC_ISSUER_ID    App Store Connect API (Team key, role "App Manager")
#   ASC_KEY_P8     contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID  developer.apple.com -> Membership -> Team ID
# Variable APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION for a company account
# (default INDIVIDUAL).
# The Supabase address and publishable key are public and live in eas.json.
name: Yönetim iPhone (TestFlight)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Derledikten sonra TestFlight'a gönder"
        type: boolean
        default: true
      setup_credentials:
        description: "İlk sefer: Apple imza sertifikasını ve profilini oluştur"
        type: boolean
        default: false
  # A merge that changes the phone app builds and sends it to TestFlight by
  # itself (Claude's GitHub app may not start workflows by hand).
  push:
    branches: [main]
    paths:
      - 'apps/manager-mobile/**'
      - '!apps/manager-mobile/store/**' # App Store page only (app-store-metadata.yml)
      - 'packages/shared/**'
      - '.github/workflows/mobile-ios.yml'

concurrency:
  group: mobile-ios
  cancel-in-progress: false

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/manager-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --filter "@crumble/manager-mobile..."

      - name: Typecheck
        working-directory: .
        run: pnpm --filter "@crumble/manager-mobile..." typecheck

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # App Store Connect API key: lets EAS create the signing certificate and
      # profile and upload to TestFlight without an Apple ID login.
      # The same key is written into the submit profile at run time; otherwise
      # --auto-submit tries to create a new submission key, which needs an
      # Apple ID login (the first run hung at that prompt).
      - name: App Store Connect key
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          jq --arg path "$RUNNER_TEMP/asc.p8" --arg id "$ASC_KEY_ID" --arg issuer "$ASC_ISSUER_ID" \
            '.submit.production.ios += {ascApiKeyPath: $path, ascApiKeyId: $id, ascApiKeyIssuerId: $issuer}' \
            eas.json > "$RUNNER_TEMP/eas.json"
          mv "$RUNNER_TEMP/eas.json" eas.json
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      # EAS creates the distribution certificate and provisioning profile, and
      # adds new capabilities (Push Notifications) to the App ID, only in
      # interactive mode. That mode answers its prompts with the defaults
      # ("yes") through a pseudo terminal (script). Automatic builds after a
      # merge always use it, so a new capability never breaks them; a manual
      # run uses it when "İlk sefer" is ticked.
      - name: Build (and submit)
        run: |
          args="--platform ios --profile production --wait ${{ (github.event_name == 'push' || inputs.submit) && '--auto-submit' || '' }}"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.setup_credentials }}" = "true" ]; then
            # One Enter every 2 s (a flood of input would fill the terminal and hang).
            (while sleep 2; do echo; done) | env -u CI timeout 45m script -qefc "eas build $args" /dev/null
          else
            eas build $args --non-interactive
          fi
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }} # or COMPANY_OR_ORGANIZATION

      # EAS keeps the real build error in its own logs; print them here so a
      # failure can be read from GitHub alone.
      - name: EAS build log (on failure)
        if: failure()
        run: |
          id=$(eas build:list --platform ios --limit 1 --json --non-interactive | jq -r '.[0].id') || exit 0
          # build:view returns the full build, including its log file URLs.
          eas build:view "$id" --json > "$RUNNER_TEMP/build.json" || exit 0
          jq -r '"Build \(.id) status \(.status), \(.logFiles | length) log files"' "$RUNNER_TEMP/build.json"
          jq -r '.error // empty' "$RUNNER_TEMP/build.json"
          for url in $(jq -r '.logFiles[]?' "$RUNNER_TEMP/build.json"); do
            curl -sSL "$url" -o "$RUNNER_TEMP/eas.log" || continue
            # Lines are JSON (bunyan); show the failed phase and any errors.
            jq -Rr 'fromjson? | select(.phase != null) | "[\(.phase)] \(.msg)"' "$RUNNER_TEMP/eas.log" \
              | grep -v '^\[INSTALL_PODS\]\|^\[RUN_FASTLANE\]' | tail -n 150
          done
