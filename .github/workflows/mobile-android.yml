# Builds the manager app (Crumble Yönetim) for Android on Expo's servers (EAS)
# as an APK that installs from a link: no Google Play needed (2026-11-04, a
# partner's phone is Android). The link is in this run's summary and on
# expo.dev (Builds); opening it on the phone downloads the APK.
#
# Uses EXPO_TOKEN (see mobile-ios.yml). EAS keeps the Android signing key
# (created on the first build, 2026-11-04), so builds run non-interactively.
name: Yönetim Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/manager-mobile/**'
      - '!apps/manager-mobile/store/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile-android.yml'

concurrency:
  group: mobile-android
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/manager-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --filter "@crumble/manager-mobile..."

      - name: Typecheck
        working-directory: .
        run: pnpm --filter "@crumble/manager-mobile..." typecheck

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile android-apk --wait --non-interactive

      - name: Download link
        if: always()
        run: |
          eas build:list --platform android --limit 1 --json --non-interactive > "$RUNNER_TEMP/build.json" || exit 0
          jq -r '.[0] | "Build \(.id) \(.status)\nAPK: \(.artifacts.buildUrl // "-")\nKurulum sayfası (telefonda aç): https://expo.dev/accounts/basakrdnzs-team/projects/crumble-yonetim/builds/\(.id)"' "$RUNNER_TEMP/build.json" | tee -a "$GITHUB_STEP_SUMMARY"
